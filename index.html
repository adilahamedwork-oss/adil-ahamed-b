<style>
  :root{
    --bg:#0b0b10; --surface:#12121a; --surface-2:#171722; --border:#2a2a35;
    --text:#e5e7eb; --muted:#a3b0c2; --white:#fff;
    --lime:#bef264; --sky:#38bdf8; --violet:#a78bfa; --green:#4ade80; --red:#f87171;
    --radius:18px; --maxw:1040px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:76px}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.7;
    background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:48px 48px;
  }
  a{color:var(--sky)}
  :focus-visible{outline:3px solid var(--lime);outline-offset:3px;border-radius:6px}
  .skip{position:absolute;left:-999px;top:8px;background:var(--lime);color:#000;padding:10px 16px;border-radius:8px;z-index:200}
  .skip:focus{left:8px}

  /* Header / nav */
  header{position:sticky;top:0;z-index:100;background:rgba(11,11,16,.88);backdrop-filter:blur(10px);border-bottom:1px solid #1c1c26}
  .nav{max-width:var(--maxw);margin:auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
  .logo{font-family:ui-monospace,Consolas,monospace;color:var(--white);text-decoration:none;font-weight:700;letter-spacing:.04em}
  .logo span{color:var(--lime)}
  .nav ul{list-style:none;margin:0;padding:0;display:flex;gap:4px}
  .nav ul a{display:block;padding:8px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-size:.92rem}
  .nav ul a:hover{color:var(--white);background:var(--surface-2)}
  .menu-btn{display:none;background:var(--surface);border:1px solid var(--border);color:var(--white);border-radius:10px;padding:8px 14px;font-size:.95rem;cursor:pointer}
  @media(max-width:860px){
    .menu-btn{display:block}
    .nav ul{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;background:#0f0f16;border-bottom:1px solid var(--border);padding:10px 20px 16px}
    .nav ul.open{display:flex}
  }

  /* Layout */
  section{max-width:var(--maxw);margin:auto;padding:64px 20px}
  .label{font-family:ui-monospace,Consolas,monospace;letter-spacing:.25em;font-size:.82rem;color:var(--lime);margin:0 0 12px}
  h1{font-size:2.3rem;line-height:1.15;margin:22px 0 14px;color:var(--white)}
  h2{font-size:1.9rem;line-height:1.2;color:var(--white);margin:0 0 18px}
  h3{color:var(--white);margin:0 0 6px;font-size:1.2rem}
  p{font-size:1.05rem;color:#cbd5e1;margin:0 0 14px}
  .grad{background:linear-gradient(90deg,var(--lime),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent}
  .grad2{background:linear-gradient(90deg,var(--violet),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{font-size:1.15rem;max-width:680px}
  @media(min-width:700px){h1{font-size:3.3rem}h2{font-size:2.2rem}}
